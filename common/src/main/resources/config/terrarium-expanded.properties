# Terrarium Expanded runtime performance settings. Restart to apply changes.
# Earth generation is configured in a world-preset datapack; see:
# https://github.com/intplex/terrarium-expanded/blob/main/documentation/SERVER_SETUP.md
# Existing worlds keep their saved generation settings.

# Combined tile/snapshot cache budget in MiB (16-8192), and tile share (1-99%).
memory.total_budget_mb=96
memory.tiles_budget_percent=85
# Cache expiry in seconds (0 disables expiry; maximum 86400).
memory.tile_ttl_seconds=120
memory.snapshot_ttl_seconds=120
# Per-thread cache entries (1-1024) and idle expiry (0-3600 seconds; 0 disables).
memory.local_chunk_entries=16
memory.local_biome_entries=4
memory.local_idle_seconds=10
# Shared download worker count (1-64).
io.shared_tile_threads=4
# Neighbour tile prefetch radii (0-8); larger values increase memory/network use.
tiles.terrain.prefetch_radius=0
tiles.recovery.prefetch_radius=0
tiles.surface_water.prefetch_radius=0
tiles.ecoregion.prefetch_radius=0
